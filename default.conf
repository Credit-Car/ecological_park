server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://host.docker.internal:6789;
        proxy_set_header Host $host;
    }

    location /webhook/ {
        proxy_pass http://host.docker.internal:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}