server {
    listen       80;
    listen  [::]: 80;
    server_name  localhost;

    # 1. Main Flutter Web App (wetland)
    location / {
        # Routes internally to the 'wetland' container on port 80
        proxy_pass http://wetland:6789; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Your Webhook / API Proxy
    location ~ ^/webhook/[0-9a-f-]+/chat {
        limit_except POST GET OPTIONS {
            deny all;
        }
        
        # If this specific API runs on your host machine, keep host.docker.internal
        proxy_pass http://host.docker.internal:5678;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /mataian/ {
        proxy_pass http://host.docker.internal:9020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}