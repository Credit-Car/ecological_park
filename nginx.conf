server {
    listen 80;
    server_name localhost;

    # 1. Windows Docker Resolver (Crucial for host.docker.internal)
    resolver 127.0.0.11 valid=30s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. YOUR WEBHOOK PROXY (Keep this if you still need it)
    location ~ ^/webhook/[0-9a-f-]+/chat/user_id-[a-zA-Z0-9]+ {
        # Use host.docker.internal to reach your Mac
        proxy_pass http://host.docker.internal:5678;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # # 2. YOUR WEBHOOK PROXY (Keep this if you still need it)
    # location ~ ^/webhook/[0-9a-f-]+/chat/user_id-[a-zA-Z0-9]+ {
    #     # Use host.docker.internal to reach your Mac
    #     proxy_pass http://host.docker.internal:5678;

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}