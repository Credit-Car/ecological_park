server {
    listen 80;
    server_name localhost;

    # Where the Flutter build files will live inside the container
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This checks if the file exists, if not, it sends the request to index.html
        # This is what allows your "different pages" to work without 404 errors
        try_files $uri $uri/ /index.html;
    }

    # Optimizing performance for your mock data and assets
    location ~* \.(?:json|css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}